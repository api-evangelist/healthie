  - {code: DUPLICATE_OR_OWN_NOTE, meaning: The provider already created their own note for this
      encounter.}
  verified_in: graphql/healthie-schema.graphql
gaps:
- No published error-code reference page. Only one extensions.code value is documented platform-wide.
- No RFC 9457 problem+json, no type URIs, no per-error documentation links.
- Healthie documents a known non-conformance (404 responses) without a dated remediation commitment.
- Validation failures are invisible to a client that inspects only the GraphQL errors[] array.
