docs: https://docs.gethealthie.com/guides/api-concepts/error-handling
format: graphql-errors
format_note: >-
  NOT RFC 9457. Healthie is a GraphQL API and returns no application/problem+json. It targets the
  GraphQL specification section 7.1.2 errors[] array, and states it also strives to follow RFC 9110
  HTTP semantics "where applicable" — while explicitly acknowledging in its own docs that some 404
  Not Found responses do not conform to the GraphQL spec and are pending remediation. Healthie
  publishes no consolidated error-code reference page; the catalogue below is assembled from the
  error-handling and rate-limit guides plus the error shapes declared in the schema.
completeness: partial
completeness_note: >-
  Healthie does not publish an enumerated error-code registry. Only one machine-readable
  extensions.code value (TOO_MANY_REQUESTS) appears anywhere in the public documentation. Everything
  else surfaces as free-text `message` strings, which a client can only pattern-match on.
envelopes:
- id: transport-errors
  shape: 'errors: [{ message: String, extensions: { code: String } }]'
  applies_to: parse errors, validation of the query document, auth failures, rate/complexity/depth
    limits, server errors
  spec: GraphQL specification section 7.1.2
  note: The `extensions.code` key is present on some errors and absent on others.
- id: field-errors
  shape: 'messages: [FieldError]  # FieldError { field: String, message: String! }'
  applies_to: business/validation failures on mutations
  http_status: 200
  note: >-
    THE MOST IMPORTANT ERROR SHAPE IN THIS API, and the easiest to miss. Mutation validation failures
    do not populate the transport-level errors[] array at all. Every mutation payload carries a
    `messages: [FieldError]` list next to the mutated object; on failure the object comes back null
    or unchanged, the HTTP status is 200, and errors[] is empty. A client that branches only on
    `response.errors` reads a rejected write as a successful one. FieldError is referenced by 425
    payload types in the schema — effectively every mutation.
  verified_in: graphql/healthie-schema.graphql
- id: eligibility-check-errors
  shape: 'ClaimEligibilityCheckErrors { code: String, description: String }'
  applies_to: insurance eligibility checks
  note: >-
    A domain-specific error object carrying a payer/clearinghouse error code and description. The
    code values are passed through from the eligibility partner and are not enumerated by Healthie.
  verified_in: graphql/healthie-schema.graphql
problems:
- id: too-many-requests
  code: TOO_MANY_REQUESTS
  envelope: transport-errors
  title: Rate limit exceeded
  message: 'Too many requests. Please try again later.'
  remediation: >-
    Back off and retry. Healthie publishes no rate-limit response headers and no Retry-After, so the
    backoff interval cannot be computed from the response — use exponential backoff with jitter.
  source: https://docs.gethealthie.com/guides/api-concepts/rate-limits
- id: complexity-limit-exceeded
  code: null
  envelope: transport-errors
  title: Query complexity limit exceeded
  message: 'Query has complexity of {n}, which exceeds max complexity of 2000'
  remediation: >-
    Reduce the selection set or lower the connection page size. An unpaginated connection is scored
    with a default page size of 100, so adding an explicit `first:` is usually the fix.
  retryable: false
  source: https://docs.gethealthie.com/guides/api-concepts/rate-limits
- id: depth-limit-exceeded
  code: null
  envelope: transport-errors
  title: Query depth limit exceeded
  message: 'Query has depth of {n}, which exceeds max depth of 25'
  remediation: Flatten the query; fragments and inline fragments count toward depth.
  retryable: false
  source: https://docs.gethealthie.com/guides/api-concepts/rate-limits
- id: not-found
  code: null
  envelope: transport-errors
  http_status: 404
  title: Resource not found
  remediation: >-
    Verify the ID and the environment. IDs are NOT portable between sandbox and production. Note
    Healthie's own caveat that these 404 responses are known to be non-conformant with the GraphQL
    specification.
  source: https://docs.gethealthie.com/guides/api-concepts/error-handling
- id: mutation-validation-failed
  code: null
  envelope: field-errors
  http_status: 200
  title: Mutation validation failed
  shape: 'messages: [{ field: "<input field>", message: "<validation message>" }]'
  remediation: >-
    Always select `messages { field message }` on every mutation and treat a non-empty messages array
    as a failure, regardless of HTTP status or an empty errors[] array.
  source: graphql/healthie-schema.graphql
