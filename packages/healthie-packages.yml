note: >-
  Healthie ships first-party client libraries only for the browser/React tier. There is no
  first-party server-side SDK for Ruby, Python, PHP, Go, Java, .NET or Rust — a search of
  RubyGems, PyPI, Packagist, pkg.go.dev, Maven Central, NuGet and crates.io returned no
  Healthie-published package. Server-side integrators call the GraphQL endpoint directly with
  any HTTP/GraphQL client, which is what the Healthie docs instruct. The MCP server
  (healthie-dev-assist) is distributed by git clone rather than through a registry, so it has
  no registry metadata to read and is catalogued in mcp/healthie-mcp.yml instead.
