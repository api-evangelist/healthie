note: >-
  Healthie runs TWO separate change surfaces and they are not interchangeable. This changelog tracks
  only NON-BREAKING, accretive schema changes, which land in every API version immediately including
  the 2024-06-01 baseline. Breaking changes are recorded separately in the Version History and require
  opting into a dated Healthie-GraphQL-API-Version header — see lifecycle/healthie-lifecycle.yml.
  The changelog is unusually machine-friendly for a docs page: entries are written as normalized
  schema diffs ("Type X was added", "Field Y was added to object type Z", "Argument A added to field
  Q.r"), which reads like the output of a schema-diff tool rather than hand-written release notes.
change_classes_tracked:
