entries:
- date: '2026-07-31'
  breaking: false
  highlights:
  - Types DosespotRoleEnum, UpdateGeneratedSummaryInput, UpdateGeneratedSummaryPayload added
  - Mutation.updateGeneratedSummary added — editing of AI-generated clinical summaries
  - GeneratedSummary gains edited_at and edited_by, making human edits to AI output attributable
  - metadata (JSON) added to AllergySensitivity, Diagnosis, MedicationType and their create/update
    inputs
  - DoseSpot gains has_valid_credentials and role; IntegrationOptionType gains integration_request_status
  - RequestIntegrationInput.integration_name relaxed from String! to String, and integration_option_id added
- date: '2026-07-24'
  breaking: false
  highlights:
  - rxcui added to DosageType and MedicationType; ndc added to MedicationType — standard RxNorm and
    NDC drug identifiers now exposed on the medication surface
  - exclude_group_appointments argument added to Query.appointments and Query.appointmentsCount
  - start_date / end_date arguments added to Query.formAnswerGroupsCount
  - DOCUMENT_SHARING enum value added to SentWebhookResourceType
- date: '2026-07-17'
  breaking: false
  highlights:
  - EmbeddedZoomCredentials type added
  - Mutation.updateAppointmentFormAnswerGroupConnection added, with matching input/payload types
  - Action enum gains APPOINTMENT_LINKED, APPOINTMENT_UNLINKED, APPOINTMENT_RELINKED
  - CustomModuleForm.is_scribe_form added — forms can now be flagged as AI-scribe targets
  - CptCode.fee_per_unit added
- date: '2026-07-10'
  breaking: false
  highlights:
  - metadata added to BillingItem
  - DrugAllergenTypeEnum gains ROUTED_DOSE_FORM_DRUG and FOOD_AND_ENVIRONMENT_ALLERGEN
  - start_date / end_date arguments added to Query.formAnswerGroups
- date: '2026-07-03'
  breaking: false
  highlights:
  - OrganizationConfigurationType added with Mutation.updateOrganizationConfiguration
  - Organization.configuration added
  - OrganizationMembership gains granular appointment permissions (can_edit_own_appointments,
    can_edit_others_appointments, can_delete_own_appointments, can_delete_others_appointments)
- date: '2026-06-26'
  breaking: false
  deprecations: true
  highlights:
  - 'Change Healthcare wind-down begins in the schema: ClaimDestinationIntegration.change_health and
    EligibilityCheckService.change_health both deprecated ("ChangeHealth claims integration has been
    discontinued", "Use claim_md instead")'
  - InsurancePlan.change_healthcare_eligibility_payer_id deprecated
  - FullscriptEntrypoint and EntryImageStyleEnum types added
