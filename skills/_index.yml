cross_cutting_rules:
- Healthie has NO idempotency contract — no Idempotency-Key, no de-duplication, and clientMutationId
  was removed in version 2025-10-15. Query before retrying any write.
- Mutation validation failures return HTTP 200 with an EMPTY GraphQL errors[] array and a populated
  messages[] FieldError list. Always select messages { field message }.
- No rate-limit response headers and no Retry-After. Back off exponentially with jitter.
- Max query complexity 2000, max depth 25; connection cost is multiplied by page size, and an
  omitted page size is scored as 100.
- Pin Healthie-GraphQL-API-Version; the unversioned default is the 2024-06-01 baseline.
- Everything on this API is PHI. Do not echo patient data into logs, prompts or traces.
