versioning:
  scheme: date-based, opt-in via request header
  header: Healthie-GraphQL-API-Version
  current_default: '2024-06-01'
  latest: '2026-01-01'
  cumulative: true
  docs: https://docs.gethealthie.com/guides/api-concepts/versioning
  model: >-
    Two-track. BREAKING changes are gated behind a dated version an integrator must opt into by
    setting the header; ADDITIVE changes ship by accretion and are live in every version — including
    the 2024-06-01 baseline — the moment they land. A request with no version header is served the
    baseline, so an unversioned client never silently receives a breaking change.
  breaking_change_definition:
  - Removing a field
  - Changing the return type of a field
  - Changing an input argument default (e.g. a query becoming paginated by default)
  - Making a field nullable when it was previously non-nullable
  - Making an input argument non-nullable when it was previously nullable
  non_breaking_change_definition:
  - Adding new queries, mutations, or fields
  - Adding an optional new input argument to an existing mutation
  - Adding a new filter or sort_by option to an existing field
  - Adding new/updated data to Healthie-provided resource queries (insurance plans, ICD codes)
  - Fixing an internal server error
