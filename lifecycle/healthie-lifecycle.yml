deprecation:
  policy_url: https://docs.gethealthie.com/guides/api-concepts/deprecations
  policy_published: true
  notice_period: 6 months minimum before removal
  migration_instructions_promised: true
  mechanism: GraphQL @deprecated directive on fields and enum values
  mechanism_note: >-
    Healthie carries deprecation IN THE CONTRACT rather than only in prose — the @deprecated directive
    surfaces the warning in any GraphQL IDE, editor or codegen tool, which is stronger than a docs
    page and is machine-readable by an agent reading the SDL.
  sunset_header: false
  sunset_header_note: >-
    No RFC 8594 Sunset or Deprecation HTTP header. Deprecation is expressed only in the schema and in
    the docs, so a running client gets no runtime warning on the wire.
  contact: hello@gethealthie.com
  published_deprecations:
  - feature: String-based sort_by query arguments
    deprecated_on: '2023-11-06'
    expected_removal: '2024-08-06'
    recommendation: Use the enum-based order_by arguments.
    status: past its stated removal date and still present in the schema
